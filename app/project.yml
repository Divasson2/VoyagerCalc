# SPDX-License-Identifier: MIT
# XcodeGen spec equal to the checked-in VoyagerCalc.xcodeproj (which tools/genproj.py writes).
# Optional: `xcodegen generate` makes the same project if you prefer XcodeGen.
name: VoyagerCalc
options:
  bundleIdPrefix: com.josegonzalezdivasson
  deploymentTarget: { macOS: "14.0", iOS: "17.0" }
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/../core/include
    HEADER_SEARCH_PATHS: $(SRCROOT)/../core/include
    GCC_C_LANGUAGE_STANDARD: c11
    GCC_OPTIMIZATION_LEVEL: "2"
    MARKETING_VERSION: "0.7.4"
    CURRENT_PROJECT_VERSION: "2"
targets:
  VoyagerCalc-macOS:
    type: application
    platform: macOS
    sources: [Sources, { path: ../core/src, name: C core }, { path: Resources/Faces, buildPhase: resources }, { path: Resources/Fonts, buildPhase: resources }, Resources/macOS/Assets.xcassets]
    settings:
      base:
        PRODUCT_NAME: VoyagerCalc
        PRODUCT_BUNDLE_IDENTIFIER: com.josegonzalezdivasson.VoyagerCalc
        INFOPLIST_FILE: Resources/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/macOS/VoyagerCalc.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application: The Calculator Store SLNE (XZKHVBD7Q9)"
          DEVELOPMENT_TEAM: XZKHVBD7Q9
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: --timestamp
  VoyagerCalc-iOS:
    type: application
    platform: iOS
    sources: [Sources, { path: ../core/src, name: C core }, { path: Resources/Faces, buildPhase: resources }, { path: Resources/Fonts, buildPhase: resources }, Resources/iOS/Assets.xcassets]
    settings:
      base:
        PRODUCT_NAME: VoyagerCalc
        PRODUCT_BUNDLE_IDENTIFIER: com.josegonzalezdivasson.VoyagerCalc
        INFOPLIST_FILE: Resources/iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  VoyagerCalcTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - { path: Sources, excludes: [App/VoyagerCalcApp.swift] }
      - { path: ../core/src, name: C core }
      - Tests/KitTests
      - Tests/AppTests
      - { path: Resources/Faces, buildPhase: resources }
      - { path: Resources/Fonts, buildPhase: resources }
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
